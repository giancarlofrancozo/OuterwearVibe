<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Dropshipping</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #222; color: #fff; padding: 16px 24px; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 24px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .card h3 { margin: 0 0 8px; font-size: 18px; }
    .card p { color: #555; font-size: 14px; min-height: 36px; }
    .preco { font-size: 20px; font-weight: bold; color: #1a7f37; }
    .estoque { font-size: 12px; color: #888; }
    button { width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 6px; background: #222; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Loja Dropshipping</h1>
  </header>
  <main id="produtos"></main>

  <script>
    function formatarPreco(valor) {
      return valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    async function carregarProdutos() {
      const resposta = await fetch("/produtos");
      const produtos = await resposta.json();
      const container = document.getElementById("produtos");

      container.innerHTML = produtos.map(produto => `
        <div class="card">
          <h3>${produto.nome}</h3>
          <p>${produto.descricao ?? ""}</p>
          <div class="preco">${formatarPreco(produto.preco)}</div>
          <div class="estoque">${produto.estoque} unidades disponíveis</div>
          <button>Comprar</button>
        </div>
      `).join("");
    }

    carregarProdutos();
  </script>
</body>
</html>
